# VIAHIND Vision - single-site deployment (local processing) with PostgreSQL.
#   cp backend/.env.example backend/.env   # set SECRET_KEY, POSTGRES_PASSWORD, ...
#   docker compose up -d --build
#   docker compose exec backend python manage.py create-user admin --role admin
# Put an HTTPS reverse proxy (Caddy, nginx, Traefik) in front of ports 3000/8000 in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viahind_vision
      POSTGRES_USER: viahind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the shell or a .env file next to this compose file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viahind -d viahind_vision"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://viahind:${POSTGRES_PASSWORD}@db:5432/viahind_vision
      STORAGE_DIR: /app/storage
      SNAPSHOT_DIR: /app/storage/snapshots
      MODEL_DIR: /app/storage/models
    volumes:
      - storage:/app/storage
      # Optional: mount YOLO weights read-only and set PERSON_MODEL_PATH=/models/yolo11n.pt
      # - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  storage:
